<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<!-- Publicado num site de verdade (GitHub Pages), o YouTube aceita o player: e isso que evita o erro 153 dentro do FiveM. -->
	<meta name="referrer" content="strict-origin-when-cross-origin">
	<title>YouTube Bridge</title>
	<style>html, body { margin: 0; background: transparent; overflow: hidden; }</style>
</head>
<body>
	<div id="Player"></div>

	<script>
		// Recebe comandos do xSound (resource "sounds" da cidade) por postMessage e devolve os eventos do player.
		const Query = new URLSearchParams(location.search);
		const Key = Query.get("id") || "";
		const Video = (Query.get("v") || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 11);
		let Player = null;

		const Send = (Type, Data = {}) => parent.postMessage(Object.assign({ source: "ytbridge", id: Key, type: Type }, Data), "*");

		window.onYouTubeIframeAPIReady = () => {
			if (!Video) return Send("error", { code: 2 });

			Player = new YT.Player("Player", {
				width: "200",
				height: "200",
				videoId: Video,
				playerVars: { autoplay: 0, controls: 0, playsinline: 1, enablejsapi: 1, origin: location.origin },
				events: {
					onReady: () => Send("ready", { duration: Player.getDuration() }),
					onStateChange: (Event) => Send("state", { state: Event.data, duration: Player.getDuration() }),
					onError: (Event) => Send("error", { code: Event.data })
				}
			});
		};

		addEventListener("message", (Event) => {
			const Message = Event.data;
			if (!Message || Message.target !== "ytbridge" || !Player) return;

			switch (Message.cmd) {
				case "play": Player.playVideo(); break;
				case "pause": Player.pauseVideo(); break;
				case "stop": Player.stopVideo(); break;
				case "seek": Player.seekTo(Number(Message.value) || 0, true); break;
				case "volume": Player.setVolume(Math.max(0, Math.min(100, Number(Message.value) || 0))); break;
				case "unmute": Player.unMute(); break;
			}
		});
	</script>
	<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
